name: Create Release on SemVer Tag

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract changelog section
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"

          # CHANGELOG.md headings are always `v`-prefixed (e.g. `## [v4.1.0]`),
          # even for tags that dropped the `v` prefix, so normalize the tag
          # to the heading's format regardless of how the git tag is written.
          CURRENT_HEADING="v${CURRENT_TAG#v}"

          echo "Generating changelog for $CURRENT_HEADING"

          # Print from the current release's heading up to (not including)
          # the next "## [" heading, whatever it is. Comparing tags via
          # `git tag --sort=-v:refname` to find a "previous" heading is not
          # reliable here: this repo's history mixes `v`-prefixed and
          # unprefixed tags, and git's version-sort treats the literal `v`
          # as greater than a leading digit, so it does not sort tags into
          # true release order.
          awk -v heading="## [$CURRENT_HEADING]" '
            $0 == heading { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create
          "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "Release $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
