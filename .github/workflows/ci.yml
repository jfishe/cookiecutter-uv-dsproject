name: Create Release on SemVer Tag

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required to inspect previous tags
          persist-credentials: false

      - name: Get previous tag
        id: prev
        run: |
          # Get the previous tag before the current one
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG="${STEPS_PREV_OUTPUTS_PREVIOUS_TAG}"

          # CHANGELOG.md headings are always `v`-prefixed (e.g. `## [v4.1.0]`),
          # even for tags that dropped the `v` prefix, so normalize both tags
          # to the heading's format regardless of how the git tag is written.
          CURRENT_HEADING="v${CURRENT_TAG#v}"
          PREV_HEADING="v${PREV_TAG#v}"

          echo "Generating changelog for $CURRENT_HEADING since $PREV_HEADING"

          # Extract lines between headings for the two tags
          awk "/^## \[$CURRENT_HEADING\\]/,/^## \[$PREV_HEADING\\]/" CHANGELOG.md |
          sed '$d' > RELEASE_NOTES.md
        env:
          STEPS_PREV_OUTPUTS_PREVIOUS_TAG: ${{ steps.prev.outputs.previous_tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create
          "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "Release $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
