name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
{%- if cookiecutter.type_checker == "mypy" %}
      - run: uv run mypy src/
{%- elif cookiecutter.type_checker == "ty" %}
      - run: uv run ty check src/
{%- else %}
      - run: uv run pyrefly check
{%- endif %}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHON_VERSION: {% raw %}${{ matrix.python-version }}{% endraw %}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "{{ cookiecutter.min_python_version }}"
          - "{{ cookiecutter.python_version }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python {% raw %}${{ matrix.python-version }}{% endraw %}
        run: uv python install "$PYTHON_VERSION"
      - run: uv sync --all-extras --python "$PYTHON_VERSION"
      - run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage
        if: {% raw %}matrix.python-version == '{{ cookiecutter.python_version }}'{% endraw %}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
