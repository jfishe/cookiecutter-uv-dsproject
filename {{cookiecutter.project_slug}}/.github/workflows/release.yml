name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/{{ cookiecutter.project_slug }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # required for Sigstore keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: CSchoel/release-notes-from-changelog@3594292798d8d7eaed04d0a436a5fa2b22e448c7 # v1.3.0
        with:
          begin-pattern: '/^## \\[v${RELEASE_VERSION}\\]/'
          link-pattern: '^\\[v${RELEASE_VERSION}\\]:'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          GH_TOKEN: {% raw %}${{ github.token }}{% endraw %}
        run: >-
          gh release create
          "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --notes ""
          --draft
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: {% raw %}${{ github.token }}{% endraw %}
        run: >-
          gh release upload
          "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
      - name: Update release notes from changelog
        env:
          GITHUB_TOKEN: {% raw %}${{ github.token }}{% endraw %}
        run: >-
          gh release edit
          "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --notes-file RELEASE.md
          --title "Version $RELEASE_VERSION"
          --draft=false
