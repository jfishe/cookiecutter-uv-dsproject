# Update hook revs with:
{%- if cookiecutter.pre_commit_tool == "prek" %}
#   uv run prek update --cooldown-days 7
{%- else %}
#   uv run pre-commit autoupdate
{%- endif %}
repos:
{%- if cookiecutter.pre_commit_tool == "prek" %}
  # prek's Rust-native versions of the standard pre-commit-hooks.
  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=auto"] # replace 'auto' with 'lf' to enforce Linux/Mac line endings or 'crlf' for Windows
      - id: trailing-whitespace

  # Python-specific hooks that have no prek builtin.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: debug-statements
      - id: name-tests-test
        args: ["--pytest-test-first"]
{%- else %}
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=auto"] # replace 'auto' with 'lf' to enforce Linux/Mac line endings or 'crlf' for Windows
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace
{%- endif %}

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt

  # ruff-format also formats Python code blocks in Markdown (ruff >= 0.16).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes", "--exit-non-zero-on-fix"]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  # Markdown lint and auto-fix; configured under [tool.rumdl] in pyproject.toml.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.2
    hooks:
      - id: rumdl-check
        args: ["--fix"]

  # Check for misspells in documentation files:
  # - repo: https://github.com/codespell-project/codespell
  #   rev: v2.4.2
  #   hooks:
  #     - id: codespell
  #       args:
  #         - "--skip"
  #         - ".git/*"
  #       additional_dependencies:
  #         - tomli
{%- if cookiecutter.include_github_actions == "yes" %}

  # GitHub Actions workflows: syntax (actionlint) and security (zizmor).
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: ["--offline"]
{%- endif %}

  ## Conventional Commits
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]

{%- if cookiecutter.type_checker == "mypy" %}
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies: [pandas-stubs, joblib-stubs]
        args: ["--config-file=pyproject.toml", "src/"]
        pass_filenames: false
{%- elif cookiecutter.type_checker == "ty" %}
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check src/ --output-format concise --no-progress
        language: system
        pass_filenames: false
        types_or: [python, pyi]
{%- else %}
  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check --output-format min-text
        language: system
        pass_filenames: false
        types_or: [python, pyi]
{%- endif %}
